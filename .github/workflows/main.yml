name: CI/CD - API NestJS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si haces 2 push seguidos, se cancela el deploy viejo y gana el más nuevo
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: api-cicd-nest
  CONTAINER_NAME: api-cicd-nest

jobs:
  # ==========================================================
  # 1) CI: instalar, probar y mostrar cobertura
  # ==========================================================
  test:
    name: 🧪 Pruebas + Cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4   # toma la versión de "packageManager" en package.json

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pruebas con cobertura (mínimo 70%)
        run: pnpm test:cov

      - name: Resumen de cobertura
        if: always()
        run: pnpm coverage:summary | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compilar (verifica que el build funcione)
        run: pnpm build

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ==========================================================
  # 2) Artefacto: construir y publicar imagen en Docker Hub
  #    (solo en push a main, no en pull requests)
  # ==========================================================
  docker:
    name: 🐳 Build & Push a Docker Hub
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: ci-cd   # aquí viven los secrets

    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub (Personal Access Token)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push (tags :latest y :<commit sha>)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # 3) CD: desplegar en AWS EC2 por SSH
  # ==========================================================
  deploy:
    name: 🚀 Deploy en AWS EC2
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: ci-cd   # aquí viven los secrets

    runs-on: ubuntu-latest
    steps:
      - name: Desplegar vía SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          CONTAINER: ${{ env.CONTAINER_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,CONTAINER,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e

            echo "🔐 Login en Docker Hub"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            echo "📥 Descargando la versión más reciente"
            docker pull "$IMAGE"

            echo "🛑 Deteniendo el contenedor anterior (si existe)"
            docker stop "$CONTAINER" 2>/dev/null || true
            docker rm "$CONTAINER" 2>/dev/null || true

            echo "▶️ Levantando la nueva versión en el puerto 80"
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 80:3000 \
              "$IMAGE"

            docker logout

            echo "🩺 Verificando que la API responda"
            for i in $(seq 1 20); do
              if curl -fsS http://localhost/api/health; then
                echo ""
                echo "✅ Deploy exitoso"
                docker image prune -f
                exit 0
              fi
              sleep 2
            done

            echo "❌ La API no respondió. Logs del contenedor:"
            docker logs --tail 50 "$CONTAINER"
            exit 1
